name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'plugin/pom.xml'

      # Build the multi-module reactor from the root: parent -> core -> plugin. core/ holds the
      # classification engine + tests; plugin/ is the mojo shell that depends on core. spike/ is
      # intentionally not a reactor module (it is the throwaway M1 reference depending on local-only
      # benchmark artifacts), so `mvn verify` from the root builds core + plugin only.
      - name: Build and test (reactor)
        run: mvn -q verify
