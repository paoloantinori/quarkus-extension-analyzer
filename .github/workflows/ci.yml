name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'plugin/pom.xml'

      # spike/ is intentionally not built here: it exercises the M1 reference flow against
      # real registry benchmark artifacts that are only available locally, not in CI. It stays
      # a manual/local-only module; only plugin/ (the production module, 45 tests) is gated.
      - name: Build and test plugin
        working-directory: plugin
        run: mvn -q verify
