project_name: "quarkus-extension-analyzer"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
definition_of_done: ["Run /simplify on the changed code and apply the cleanups it surfaces", "Run /code-review at high effort on the final diff and resolve every finding"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "vi"
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
